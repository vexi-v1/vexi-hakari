[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# v4-core pins 0.8.26; uniswap-hooks accepts ^0.8.19.
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./test/fixtures" },
    { access = "read-write", path = "./web" },
]

[fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com/rpc"
